name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WuHealthGuard.slnx -c Release

      - name: Test
        run: dotnet test WuHealthGuard.slnx -c Release --no-build

      - name: Publish (win-x64, single file)
        run: >
          dotnet publish src/WuHealthGuard.Tray/WuHealthGuard.Tray.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: WuHealthGuard-win-x64
          path: publish/win-x64
